name: Update profile activity

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Refresh recently updated projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-activity.mjs

      - name: Commit only if activity changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No activity changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile activity"
          git push origin HEAD:main
